version: v2
managed:
  enabled: true
plugins:
  # Protobuf -> Go
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt:
      - paths=source_relative

  # gRPC -> Go
  - remote: buf.build/grpc/go
    out: gen/go
    opt:
      - paths=source_relative

  # gRPC-Gateway
  - remote: buf.build/grpc-ecosystem/gateway
    out: gen/go
    opt:
      - paths=source_relative
      - logtostderr=true

  # OpenAPI (Swagger)
  - remote: buf.build/grpc-ecosystem/openapiv2
    out: gen/swagger
    opt:
      - logtostderr=true

  # Protovalidate (Go bindings for buf.validate rules)
  - remote: buf.build/bufbuild/validate-go
    out: gen/go
    opt:
      - paths=source_relative
